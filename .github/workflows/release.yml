name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - native-aws-lambda-image
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the zip to (e.g. v1.0.5)"
        required: true

jobs:
  test-backend:
    runs-on: [self-hosted]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Self-hosted runners have no Maven; install a pinned release into the tool cache.
      - name: Set up Maven
        run: |
          mkdir -p "$RUNNER_TOOL_CACHE/maven"
          curl -fsSL -o /tmp/maven.tgz https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          tar -xzf /tmp/maven.tgz -C "$RUNNER_TOOL_CACHE/maven"
          echo "$RUNNER_TOOL_CACHE/maven/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      - run: mvn -B test
        working-directory: lists-service

  validate-frontend:
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - run: bun install --frozen-lockfile
        working-directory: lists-ui

      # No unit tests yet; build:production runs tsc + vite and is the gate.
      - run: bun run build:production
        working-directory: lists-ui

      - uses: actions/upload-artifact@v4
        with:
          name: lists-ui-dist
          path: lists-ui/dist

  build-backend-image:
    # Early Dockerfile validation on branch/dispatch runs. Skipped on tags:
    # the release job below already builds the image there, and a skipped
    # job still satisfies `needs`, so tags compile exactly once.
    if: github.ref_type != 'tag'
    runs-on: [self-hosted]
    permissions:
      contents: read
    steps:
      - name: Runner resources
        run: |
          uname -m
          nproc
          free -g
          df -h / /tmp
          docker system df || true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # No push: validates the Dockerfile (needs no AWS creds, so it runs
      # while the OIDC role issue is being chased down).
      - name: Build Docker image
        run: |
          docker buildx build --platform linux/arm64 \
            --provenance=false --sbom=false \
            -f lists-service/src/main/docker/lambda.Dockerfile lists-service

  release:
    runs-on: [self-hosted]
    needs: [test-backend, validate-frontend, build-backend-image]
    permissions:
      contents: write
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_SHARED_INFRA_ROLE_ARN }}
          role-skip-session-tagging: true

      - name: Docker login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin 632683202044.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build and push Docker image
        run: |
          TAG=${GITHUB_REF_NAME#v}
          docker buildx build --platform linux/arm64 \
            --provenance=false --sbom=false \
            --cache-from type=gha \
            --output type=image,name=632683202044.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/vbp/species-lists:${TAG},push=true,oci-mediatypes=false,compression=gzip \
            -f lists-service/src/main/docker/lambda.Dockerfile lists-service

      - uses: actions/download-artifact@v4
        with:
          name: lists-ui-dist
          path: lists-ui/dist

      - name: Zip built app
        run: zip -r lists-ui.zip dist
        working-directory: lists-ui

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --generate-notes
          gh release upload "$TAG" lists-ui/lists-ui.zip --clobber
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_type }}" = tag ]; then
            gh release edit "$TAG" --draft=false
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
