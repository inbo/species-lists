name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the tarball to (e.g. v1.0.5)"
        required: true

jobs:
  test-backend:
    runs-on: [self-hosted]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Self-hosted runners have no Maven; install a pinned release into the tool cache.
      - name: Set up Maven
        run: |
          mkdir -p "$RUNNER_TOOL_CACHE/maven"
          curl -fsSL -o /tmp/maven.tgz https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          tar -xzf /tmp/maven.tgz -C "$RUNNER_TOOL_CACHE/maven"
          echo "$RUNNER_TOOL_CACHE/maven/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      - run: mvn -B test
        working-directory: lists-service

  validate-frontend:
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - run: corepack enable
        working-directory: lists-ui

      - run: yarn install --frozen-lockfile
        working-directory: lists-ui

      # No unit tests yet; build:production runs tsc + vite and is the gate.
      - run: yarn build:production
        working-directory: lists-ui

      - uses: actions/upload-artifact@v4
        with:
          name: lists-ui-dist
          path: lists-ui/dist

  release:
    # Builds the ECS image once and pushes it: no separate validation build.
    # Serialized behind tests: the runner only has 7GB RAM, so the build
    # gets the whole box instead of fighting test + frontend builds.
    runs-on: [self-hosted]
    needs: [test-backend, validate-frontend]
    permissions:
      contents: write
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_SHARED_INFRA_ROLE_ARN }}
          role-skip-session-tagging: true

      - name: Docker login to Amazon ECR
        run: |
          aws ecr get-authorization-token --region ${{ secrets.AWS_REGION }} --registry-ids ${{ secrets.ECR_ACCOUNT_ID }} \
            --query 'authorizationData[].authorizationToken' --output text | base64 --decode | cut -d: -f2- \
            | docker login --username AWS --password-stdin ${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build and push Docker image
        run: |
          TAG=${GITHUB_REF_NAME#v}
          docker buildx build --platform linux/arm64 \
            --provenance=false --sbom=false \
            --cache-from type=gha \
            --output type=image,name=${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/inbo-vbp-species-list:${TAG},push=true,oci-mediatypes=false,compression=gzip \
            -f lists-service/src/main/docker/ecs.Dockerfile lists-service

      - uses: actions/download-artifact@v4
        with:
          name: lists-ui-dist
          path: lists-ui/dist

      - name: Package built app
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="$GITHUB_REF_NAME"
          VERSION=${TAG#v}
          tar -czf "lists-ui-${VERSION}.tar.gz" -C dist ./
        working-directory: lists-ui

      - name: Attach tarball to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: ${{ github.event_name != 'push' }}
          generate_release_notes: true
          files: lists-ui/lists-ui-*.tar.gz

  deploy:
    # Locked release: frontend + backend share one version, so a single
    # versions.json bump (no per-component matrix like the pipeline).
    # Tag pushes only: workflow_dispatch builds a draft, not a release.
    runs-on: [self-hosted]
    needs: [release]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout terraform repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: "inbo/inbo-aws-biodiversiteitsportaal-terraform"
          token: ${{ secrets.GIT_PAT_TOKEN }}
          fetch-depth: 0

      - name: Update versions in dev deployment
        id: update-versions
        run: |
          set -e -o pipefail

          VERSION=${GITHUB_REF_NAME#v}

          git checkout automated-version-update-species-lists || git checkout -b automated-version-update-species-lists

          git config --global user.email "support.natuurdata@inbo.be"
          git config --global user.name "Github Actions"

          jq --arg v "$VERSION" '.["species-lists"] = $v' ./versions.json > ./versions.json.tmp
          mv ./versions.json.tmp ./versions.json

          if [ -n "$(git status --porcelain)" ]; then
            git add versions.json
            git commit -m "Github actions: automated update of species-lists to ${VERSION}"
            git push --set-upstream origin automated-version-update-species-lists
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "no changes";
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        uses: actions/github-script@v7
        if: steps.update-versions.outputs.changes == 'true'
        with:
          github-token: ${{ secrets.GIT_PAT_TOKEN }}
          script: |
            const openPrs = await github.rest.pulls.list({
              owner: 'inbo',
              repo: 'inbo-aws-biodiversiteitsportaal-terraform',
              state: 'open',
              head: 'inbo:automated-version-update-species-lists'
            });
            if (openPrs.data.length === 1) {
              console.log(`PR already exists: ${openPrs.data[0].html_url}`);
              await core.summary.addHeading("Update species-lists version")
                    .addLink('PR update', openPrs.data[0].html_url)
                    .write()
              return;
            }
            const result = await github.rest.pulls.create({
              title: 'Automated species-lists version update',
              owner: 'inbo',
              repo: 'inbo-aws-biodiversiteitsportaal-terraform',
              head: 'automated-version-update-species-lists',
              base: 'dev',
              body: 'This PR is auto-generated by [a github action](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) in [${{ github.repository }}](${{ github.server_url }}/${{ github.repository }}).'
            });
            github.rest.issues.addLabels({
              owner: 'inbo',
              repo: 'inbo-aws-biodiversiteitsportaal-terraform',
              issue_number: result.data.number,
              labels: ['versions', 'automated pr']
            });
            await core.summary.addHeading("Update species-lists version")
                  .addLink('PR update', result.html_url)
                  .write()
