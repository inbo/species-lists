# This docker-compose file is used to run Elasticsearch and MongoDB for local development.
# It was copied from src/main/docker/docker-compose.yml in the spring boot project root.
# Any changes should be reflected in both files.
# TODO: Consider merging these two files into one to avoid duplication and potential inconsistencies.
version: "3.7"
services:
  app:
    image: species-lists:local
    build:
      dockerfile: ./src/main/docker/lambda.Dockerfile
      context: .
    user: "1000"
    volumes:
      - ./config:/config
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_CONFIG_ADDITIONAL-LOCATION: file:/config/lists-service-config.properties
      SPRING_AOT_ENABLED: true
    depends_on:
      - mongodb
      - elasticsearch
    ports:
      - "8080:8080"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.26-arm64
    container_name: species-lists-elastic
    environment:
      - node.name=elasticsearch
      - xpack.security.enabled=false
      - discovery.type=single-node
      - ingest.geoip.downloader.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    restart: on-failure
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://elasticsearch:9200"]
      interval: 30s
      timeout: 10s
      retries: 5
  mongodb:
    image: mongo:8
    container_name: species-lists-mongo
    restart: on-failure
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: my-super-secret-pw
    ports:
      - "27017:27017"
    volumes:
      - mongo:/data/db
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.5
    ports:
      - "9999:9999"
    environment:
      SERVER_PORT: 9999
volumes:
  mongo:
  elasticsearch:
